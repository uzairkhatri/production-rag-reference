[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-rag-reference"
version = "0.4.0"
description = "Provider-independent reference architecture for production-oriented RAG systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Uzair Khatri"}]
dependencies = ["fastapi>=0.115,<1","uvicorn>=0.30,<1","pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "openai>=1.50,<3"]
openai = ["openai>=1.50,<3"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
