name: RAG Evaluation
on:
  pull_request:
jobs:
  retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run retrieval regression gate
        run: python scripts/run_eval.py --min-recall 0.80 --min-mrr 0.80
