name: RAG Evaluation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  retrieval-quality:
    name: retrieval-quality (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: original
            corpus: evals/corpus.json
            dataset: evals/dataset.json
            baseline: evals/baseline.json
            min-abstention: "0.80"
          - suite: value-evidence
            corpus: evals/evidence-corpus.json
            dataset: evals/evidence-dataset.json
            baseline: evals/evidence-baseline.json
            min-abstention: "0.75"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run retrieval and per-case regression gate
        run: >-
          python scripts/run_eval.py --min-recall 0.80 --min-mrr 0.80
          --corpus ${{ matrix.corpus }} --dataset ${{ matrix.dataset }}
          --baseline ${{ matrix.baseline }} --min-abstention ${{ matrix.min-abstention }}
          --output reports/evaluation.json --summary-output reports/evaluation.md
      - name: Publish evaluation summary
        if: always()
        run: |
          if [ -f reports/evaluation.md ]; then
            cat reports/evaluation.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evaluation did not produce a report. Check the gate step for input or runtime errors." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload evaluation report even when the gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-${{ matrix.suite }}
          path: reports/evaluation.*
          if-no-files-found: warn
